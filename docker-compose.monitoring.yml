# Standalone monitoring stack for the Execution Events Gateway.
#
# Usage:
#   docker compose -f docker-compose.monitoring.yml up -d
#
# Prometheus: http://localhost:9095
# Grafana:    http://localhost:3001  (admin/admin, anonymous viewer enabled)
#
# The gateway must be running on the host (native or via docker-compose.yml).
# Prometheus scrapes host.docker.internal:8443/metrics.

version: '3.9'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: gateway-prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9095:9095"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.listen-address=:9095'
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: gateway-grafana
    ports:
      - "3001:3001"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SERVER_HTTP_PORT=3001
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/gateway-dashboard.json:/var/lib/grafana/dashboards/gateway-dashboard.json:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
