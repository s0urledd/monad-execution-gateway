version: '3.9'

services:
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: execution-events-gateway
    network_mode: host
    environment:
      - RUST_LOG=info
    volumes:
      # Mount the Monad event ring (read-only)
      # Update the host path if your event ring is located elsewhere
      - /var/lib/hugetlbfs/user/monad/pagesize-2MB/event-rings:/var/lib/hugetlbfs/user/monad/pagesize-2MB/event-rings:ro
    restart: unless-stopped
    # Inside Docker, bind all interfaces so the host port-forward works.
    # Native (non-Docker) builds default to 127.0.0.1:8443.
    command: ["--server-addr", "0.0.0.0:8443"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8443/health | grep -q '\"success\"'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --- Monitoring (optional) ---
  # Start with: docker compose --profile monitoring up -d

  prometheus:
    image: prom/prometheus:latest
    container_name: gateway-prometheus
    profiles: ["monitoring"]
    network_mode: host
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.listen-address=:9095'
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: gateway-grafana
    profiles: ["monitoring"]
    network_mode: host
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SERVER_HTTP_PORT=3001
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/gateway-dashboard.json:/var/lib/grafana/dashboards/gateway-dashboard.json:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
